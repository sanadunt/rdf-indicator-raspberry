<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDF Ground Companion</title><link rel="stylesheet" href="/ground.css"></head><body><header><b>RDF / GROUND COMPANION</b><span id="state">MENUNGGU NODE</span></header><div id="api-status" class="api-status" hidden role="status" aria-live="polite"><span id="api-message"></span><button id="retry" type="button">Coba lagi</button></div><main><section><small>ARAH RELATIF</small><h1 id="angle">--</h1><p id="metadata"></p><div class="plot"><canvas id="plot" width="480" height="480"></canvas></div><p id="curve"></p></section><section><h2>Kesehatan &amp; konfigurasi</h2><pre id="health"></pre><h2>Operasi</h2><p id="authstate">Login untuk mengirim command; status tetap read-only.</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="PIN admin Ground"><button id="login">Login</button><div class="actions"><button id="refresh">Refresh config</button><button id="start">Start RDF</button><button id="stop">Stop RDF</button><button id="restart">Restart RDF</button><button id="reboot">Reboot Pi</button><button id="shutdown" disabled>Shutdown Pi</button></div><label>Center + VFO0 (MHz)<input id="frequency" type="number" step="0.001"></label><button id="tune">Apply frekuensi</button><select id="profile"><option value="balanced">BALANCED</option><option value="control">CONTROL</option><option value="graph_u8">GRAPH U8</option></select><button id="setprofile">Set profil</button><pre id="operation"></pre><p class="note">Receiver ini mengirim receipt hanya untuk data yang berhasil didekode. Bukan pengganti dashboard utama. Grafik native relatif, bukan true-north.</p></section></main><script src="/ground.js"></script></body></html>
