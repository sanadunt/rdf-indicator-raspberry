schema_version: 2
node_id: uav-01
runtime_mode: read_only
state_dir: /var/lib/rdf-node
source:
  share_dir: null
  output_vfo: 0
  authority_verified: false
  angle_verified: false
  angle_mode: theta_mirror
  max_record_bytes: 16384
  poll_ms: 250
  require_frame_progress: true
link:
  serial_alias: /dev/t900
  expected_vid: '1a86'
  expected_pid: '7523'
  expected_usb_path: platform-xhci-hcd.0-usb-0:2:1.0
  local_ip: 10.90.0.2
  peer_ip: 10.90.0.1
  engine_service: null
mqtt:
  enabled: false
  host: 10.90.0.1
  port: 8883
  tls: true
  ca_file: null
  transport: tcp
  websocket_path: /mqtt
  control_credentials_file: null
  bulk_credentials_file: null
  keepalive: 15
  reconnect_max: 30
  allow_insecure_loopback: false
  backup:
    enabled: false
    host: null
    port: 8883
    transport: tcp
    websocket_path: /mqtt
    tls: true
    ca_file: null
    credentials_file: null
    commands: true
    settings_report_plaintext: false
    budget_bytes_s: 8000
telemetry:
  profile: balanced
  resume_stable_seconds: 20
  control_budget_bytes_s: 850
  bulk_budget_bytes_s: 350
freshness:
  source_status_ms: 3000
  doa_ms: 2500
  frame_progress_ms: 5000
control:
  config_patch_enabled: false
  processing_enabled: false
  restart_enabled: false
  reboot_enabled: false
  shutdown_enabled: false
  ppp_restart_enabled: false
  # Legacy compatibility only; this no longer gates Ground-origin writes.
  remote_commands_enabled: false
  helper_socket: /run/rdf-node-control/control.sock
  verify_seconds: 12
  start_timeout_seconds: 180
  # config.patch: a frequency change up to this many Hz is tried live; a larger jump or a gain change
  # restarts the SDR engine (stop -> write -> start). A live change the engine overrides, or that leaves
  # the DAQ unhealthy for retune_live_window_seconds, falls back to the same restart.
  retune_live_max_hz: 20000000
  retune_live_window_seconds: 20
  retune_settle_seconds: 5
api:
  port: 8790
  admin_hash_file: /etc/rdf-node/admin-hash.json
  session_seconds: 600
  max_clients: 16
nav:
  # GY-26 digital compass on a USB-serial (TTL) adapter, polled with the read-angle command 0x31.
  # Use a stable /dev/serial/by-id path. The service account needs the dialout group.
  compass:
    enabled: false
    device: null
    baud: 9600
    poll_ms: 500
    stale_ms: 2000
    # Added to the sensor heading (mounting offset or magnetic declination), degrees.
    offset_deg: 0.0
  # NMEA GNSS receiver (u-blox 7 on USB CDC-ACM). Position goes to MQTT only with publish_position.
  gps:
    enabled: false
    device: null
    baud: 9600
    stale_ms: 3000
    publish_position: false
    # GPS time to chrony (`refclock SOCK <path> refid GPS offset 0.2`), e.g. /run/chrony.gps.sock.
    chrony_sock: null
  # Array heading stamped on every DoA sample (telemetry/doa h, b): where the array reference
  # (DoA 0°) points, clockwise from north. compass: the compass (offset_deg turns it into the array
  # reference), GPS course when the compass has nothing; gps: GPS course while moving, held after a
  # stop, the compass when neither; auto: GPS course while moving, else the compass, else the held course.
  heading:
    source: compass
    # GPS course counts only at or above this speed, for this long without a break.
    gps_min_speed_mps: 2.0
    gps_min_seconds: 3
    # How long the last GPS course stays usable after the node slows down or stops.
    hold_seconds: 30
    # Array reference relative to the direction of travel (0 = DoA 0° points where the vehicle goes).
    travel_offset_deg: 0.0
testing:
  # Laptop/macOS testing only. `system` uses the OS clock as the data clock instead of timedatectl;
  # it is labelled TEST (state.clock), clk stays 0, and helper-backed commands stay CLOCK_UNTRUSTED.
  # Rejected with runtime_mode: controlled.
  clock: null
display:
  theme: dark
  accent: teal
  font: system
  blank_after_seconds: 0
