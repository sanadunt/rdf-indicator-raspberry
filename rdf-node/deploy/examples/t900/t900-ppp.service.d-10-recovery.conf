# CONTOH SAJA - TIDAK dipasang otomatis oleh install.sh RDF Node.
# Drop-in systemd agar unit PPP T900 hidup lagi sendiri setelah pppd keluar.
#
# Tujuan pemasangan (nama file di tujuan: 10-recovery.conf):
#   Raspberry/Edge : /etc/systemd/system/t900-ppp.service.d/10-recovery.conf
#   Ubuntu/Ground  : /etc/systemd/system/<unit-PPP-Ground>.service.d/10-recovery.conf
#                    (nama unit milik site, mis. t900-ground-ppp.service)
# Atau jalankan "sudo systemctl edit <unit>" lalu tempel bagian [Unit]/[Service] di bawah.
#
# SEBELUM memasang, periksa Type= unit:
#   systemctl show t900-ppp.service -p Type -p LoadState
#   Type=simple/exec (pppd nodetach) : cocok, disarankan.
#   Type=forking (tanpa updetach)    : cocok.
#   Type=notify (pppd up_sdnotify) atau forking + updetach: drop-in dimuat, tetapi unit tetap
#     activating/start selama radio putus, sehingga tombol Restart T900 ditolak
#     PPP_SERVICE_NOT_ACTIVE tepat saat dibutuhkan. Ubah ke Type=simple + nodetach (blok di
#     bawah dapat dipakai; hapus up_sdnotify/updetach dari ExecStart dan file peer).
#   Type=oneshot (wrapper pon)       : systemd MENOLAK Restart=always ("...isn't allowed for
#     Type=oneshot services. Refusing.") dan unit menjadi LoadState=bad-setting. Aktifkan blok
#     "Ubah unit ke Type=simple" di bawah agar unit menjadi Type=simple + nodetach.
#
# Sesudahnya:
#   sudo systemctl daemon-reload
#   systemctl show t900-ppp.service -p Type -p LoadState -p Restart -p RestartUSec -p StartLimitIntervalUSec
# LoadState HARUS "loaded". Bila "bad-setting", cari alasannya:
#   journalctl -u t900-ppp.service -b --no-pager | grep -i refusing
# lalu perbaiki atau hapus drop-in ini dan daemon-reload lagi. pppd yang sedang berjalan tidak
# langsung berhenti, jadi kesalahan ini mudah terlewat sampai start/boot berikutnya.
#
# Restart=always: bila pppd keluar karena apa pun (device USB hilang, echo timeout tanpa
# persist, crash), systemd menjalankannya lagi setelah RestartSec. "systemctl stop" manual
# tetap menghentikan unit dan TIDAK di-restart.
# Selama jeda RestartSec unit berstatus activating/auto-restart; tombol Restart T900 di panel
# Edge tetap menerima status ini.
# StartLimitIntervalSec=0: systemd tidak berhenti mencoba karena batas laju start; RestartSec=5
# sudah membatasi laju restart.
#
# Pastikan nodetach di pppd cocok dengan Type= unit (lihat ppp-options.example).

[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5

# --- Ubah unit ke Type=simple + nodetach. WAJIB untuk Type=oneshot (wrapper pon); juga untuk
# Type=notify/forking yang diubah. Hapus tanda # pada 5 baris di bawah dan ganti GANTI_PEER
# dengan nama file di /etc/ppp/peers/ yang dipakai unit (argumen pon atau "pppd call" di
# ExecStart lama; pon tanpa argumen memakai "provider"). Hapus updetach dan up_sdnotify dari
# file peer bila ada.
# ExecStart= kosong menghapus perintah lama; ExecStop= kosong menghapus poff/stop lama sehingga
# systemd menghentikan pppd dengan SIGTERM; RemainAfterExit=no agar pppd yang keluar dengan
# status 0 juga di-restart, bukan meninggalkan unit "active (exited)".
#Type=simple
#RemainAfterExit=no
#ExecStart=
#ExecStart=/usr/sbin/pppd call GANTI_PEER nodetach
#ExecStop=
